[workspace]
members = ["crates/core", "crates/director"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Carkappa/Phantom_Blade_zero_roguelike"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
